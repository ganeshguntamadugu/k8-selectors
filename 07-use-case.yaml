apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  labels:    # These are Deployment labels
    project: expense
    enviroment: dev
    purpose: cache
spec:
  replicas: 2
  selector:
    matchLabels: # There labels are used to select the Pod and create replicas
      project: expense
      enviroment: dev
      purpose: cache
  template: # This is Pod definition
    metadata:
      labels: # These are Pod labels
        project: expense
        enviroment: dev
        purpose: cache
    spec:
      containers:
      - name: cache
        image: nginx
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: purpose
                operator: In
                values:
                - cache
            topologyKey: topology.kubernetes.io/zone
---
