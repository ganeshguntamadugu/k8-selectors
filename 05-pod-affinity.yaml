apiVersion: v1
kind: Pod
metadata:
  name: cache-pa
  labels:
    pupose: pod-affinity
spec:
  containers:
   - name: nginx-c
     image: nginx:stable-alpine3.24-perl
---
apiVersion: v1
kind: Pod
metadata:
  name: backend-pa
spec:
  containers:
   - name: nginx-c
     image: nginx:stable-alpine3.24-perl
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: pupose
            operator: In
            values:
            - pod-affinity
        topologyKey: topology.kubernetes.io/zone